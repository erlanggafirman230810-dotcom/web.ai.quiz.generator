<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator Soal - Fitur Auto Gambar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .soal-item { border-bottom: 1px solid #e5e7eb; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .img-preview { max-width: 350px; border-radius: 8px; margin-top: 1rem; border: 2px solid #e5e7eb; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b pb-6 no-print">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-3 rounded-xl text-white">
                <i class="fas fa-magic text-3xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-gray-900">AI Soal Master</h1>
                <p class="text-sm text-gray-500">Generator Soal Otomatis + Ilustrasi</p>
            </div>
        </div>
        <div class="flex flex-col gap-2">
            <input type="password" id="geminiKey" placeholder="API Key Gemini..." class="text-xs border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-300 w-64">
            <input type="password" id="openaiKey" placeholder="API Key OpenAI (DALL-E)..." class="text-xs border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-emerald-300 w-64">
        </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
        <div class="md:col-span-1 space-y-4">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 text-xs uppercase tracking-widest">⚙️ Pengaturan</h2>
                <div class="space-y-3">
                    <input type="text" id="mapel" placeholder="Mata Pelajaran" class="w-full border rounded-lg p-2 text-sm">
                    <select id="kelas" class="w-full border rounded-lg p-2 text-sm">
                        <option>Kelas 9</option>
                        <option>Kelas 8</option>
                    </select>
                    
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg mt-4 border border-gray-200">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-image text-emerald-500"></i>
                            <span class="text-sm font-semibold text-gray-700">Auto Gambar AI</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="checkGambar" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 text-xs uppercase tracking-widest">📝 Materi Soal</h2>
                <textarea id="materi" rows="5" placeholder="Ketik materi atau kisi-kisi di sini..." class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-400 mb-4 text-sm"></textarea>
                <button onclick="prosesUtama()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-play-circle"></i> Mulai Generate Soal
                </button>
            </div>
        </div>
    </div>

    <div id="loadingArea" class="hidden max-w-6xl mx-auto mt-12 text-center card p-10 no-print">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
        <p id="loadingStatus" class="text-indigo-600 font-semibold animate-pulse">Menghubungi AI...</p>
    </div>

    <div id="hasilArea" class="hidden max-w-5xl mx-auto mt-10 card p-10 border-t-8 border-indigo-600">
        <div class="flex justify-between items-center mb-10 border-b pb-6">
            <div>
                <h2 id="judulHasil" class="text-3xl font-black text-gray-900 uppercase">ASAS - KELAS 9</h2>
                <p id="labelSub" class="text-gray-500 font-medium"></p>
            </div>
            <button onclick="window.print()" class="no-print bg-gray-800 text-white px-6 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-file-pdf"></i> Simpan PDF
            </button>
        </div>
        
        <div id="kontenSoal" class="space-y-8 text-gray-800 font-serif text-lg">
            </div>
    </div>

    <script>
        async function prosesUtama() {
            const gKey = document.getElementById('geminiKey').value;
            const oKey = document.getElementById('openaiKey').value;
            const materi = document.getElementById('materi').value;
            const mapel = document.getElementById('mapel').value || "Ujian";
            const isGambar = document.getElementById('checkGambar').checked;

            if (!gKey) return alert("API Key Gemini belum diisi!");
            if (isGambar && !oKey) return alert("Kalau mau ada gambar, isi API Key OpenAI-nya dulu!");
            if (!materi) return alert("Materi kosong!");

            document.getElementById('loadingArea').classList.remove('hidden');
            document.getElementById('hasilArea').classList.add('hidden');
            document.getElementById('loadingStatus').innerText = "Gemini sedang membuat soal...";

            try {
                // 1. Generate Teks Soal via Gemini
                const prompt = `Buatkan 5 soal pilihan ganda tentang ${materi} untuk ${mapel}. Berikan format JSON saja: [{"no":1, "soal":"...", "opsi":["A","B","C","D"], "kunci":"..."}]`;
                const gRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const gData = await gRes.json();
                const jsonText = gData.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                const listSoal = JSON.parse(jsonText);

                // 2. Render dan Generate Gambar jika Dicentang
                const container = document.getElementById('kontenSoal');
                container.innerHTML = "";
                
                for (let s of listSoal) {
                    let imgHtml = "";
                    if (isGambar) {
                        document.getElementById('loadingStatus').innerText = `Membuat gambar untuk nomor ${s.no}...`;
                        const imgUrl = await buatGambar(oKey, s.soal);
                        imgHtml = `<img src="${imgUrl}" class="img-preview" />`;
                    }

                    container.innerHTML += `
                        <div class="soal-item">
                            <p><b>${s.no}.</b> ${s.soal}</p>
                            ${imgHtml}
                            <div class="grid grid-cols-2 gap-2 mt-3 text-base">
                                ${s.opsi.map((o, i) => `<div>${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
                            </div>
                        </div>
                    `;
                }

                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('hasilArea').classList.remove('hidden');
                document.getElementById('judulHasil').innerText = mapel;
            } catch (e) {
                alert("Error: " + e.message);
                document.getElementById('loadingArea').classList.add('hidden');
            }
        }

        async function buatGambar(key, promptSoal) {
            const res = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({
                    model: "dall-e-3",
                    prompt: `Simple clean educational illustration for school question: ${promptSoal}`,
                    size: "1024x1024"
                })
            });
            const data = await res.json();
            return data.data[0].url;
        }
    </script>
</body>
</html>
