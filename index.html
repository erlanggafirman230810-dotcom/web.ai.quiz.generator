const jenjang = document.getElementById("jenjang");
const mapel = document.getElementById("mapel");
const kelas = document.getElementById("kelas");
const materi = document.getElementById("materi");

jenjang.onchange = () => {

 Object.keys(data[jenjang.value]||{}).forEach(m=>{
  let o=document.createElement("option");

  mapel.appendChild(o);
 });
};

 kelas.innerHTML=""; materi.innerHTML="";
 Object.keys(data[jenjang.value][mapel.value]).forEach(k=>{
  let o=document.createElement("option");
  o.textContent=k;
  kelas.appendChild(o);
 });
};

kelas.onchange = () => {
 materi.innerHTML="";
 data[jenjang.value][mapel.value][kelas.value].forEach(m=>{
  let o=document.createElement("option");
  o.textContent=m;
  materi.appendChild(o);
