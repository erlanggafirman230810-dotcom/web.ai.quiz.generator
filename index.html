<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat Soal Otomatis - AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fas fa-robot text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">AI Pembuat Soal</h1>
                <p class="text-xs text-gray-500">Generasi Soal Otomatis via Gemini AI</p>
            </div>
        </div>
        <div class="flex gap-2">
            <input type="password" id="apiKey" placeholder="Tempel API Key Gemini di sini..." class="text-xs border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-300 w-48 md:w-64">
        </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="space-y-6">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-sm tracking-wider">
                    <i class="fas fa-id-card text-indigo-500"></i> Identitas Pelajaran
                </h2>
                <div class="space-y-4">
                    <input type="text" id="mapel" placeholder="Contoh: IPA, Matematika, Bahasa Indonesia" class="w-full border rounded-lg p-2 outline-none focus:border-indigo-500">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="fase" class="w-full border rounded-lg p-2 outline-none">
                            <option value="Fase D">Fase D (SMP)</option>
                            <option value="Fase E">Fase E (SMA 10)</option>
                        </select>
                        <select id="kelas" class="w-full border rounded-lg p-2 outline-none">
                            <option value="9">Kelas 9</option>
                            <option value="8">Kelas 8</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-sm tracking-wider">
                    <i class="fas fa-cog text-indigo-500"></i> Konfigurasi Soal
                </h2>
                <div class="space-y-4">
                    <select id="jenisSoal" class="w-full border rounded-lg p-2 outline-none">
                        <option value="Pilihan Ganda">Pilihan Ganda (4 Opsi)</option>
                        <option value="Benar Salah">Benar atau Salah</option>
                        <option value="Uraian">Soal Uraian/Essay</option>
                    </select>
                    <div class="flex justify-between text-sm text-gray-600 font-medium">
                        <span>Tingkat Kesulitan:</span>
                        <div class="flex gap-3">
                            <label><input type="radio" name="level" value="Mudah" checked> Mudah</label>
                            <label><input type="radio" name="level" value="Sedang"> Sedang</label>
                            <label><input type="radio" name="level" value="Sulit"> Sulit</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-sm tracking-wider">
                    <i class="fas fa-edit text-indigo-500"></i> Materi & Cakupan
                </h2>
                <textarea id="materi" rows="5" placeholder="Masukkan materi atau kisi-kisi soal di sini..." class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-400 mb-4"></textarea>
                
                <button onclick="prosesAI()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-magic"></i> Buat Soal Sekarang
                </button>
            </div>
        </div>
    </div>

    <div id="loadingArea" class="hidden max-w-6xl mx-auto mt-12 text-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
        <p class="text-indigo-600 font-medium animate-pulse">AI sedang berpikir dan menyusun soal...</p>
    </div>

    <div id="hasilArea" class="hidden max-w-6xl mx-auto mt-10 card p-8 border-t-8 border-indigo-600">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 class="text-2xl font-extrabold text-gray-800">Naskah Soal AI</h2>
                <p id="labelHasil" class="text-sm text-gray-500"></p>
            </div>
            <button onclick="window.print()" class="bg-gray-800 hover:bg-black text-white px-5 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-print"></i> Cetak / Simpan PDF
            </button>
        </div>
        <div id="kontenSoal" class="whitespace-pre-wrap text-gray-700 leading-relaxed font-serif text-lg">
            </div>
    </div>

    <script>
        async function prosesAI() {
            const key = document.getElementById('apiKey').value;
            const mapel = document.getElementById('mapel').value;
            const materi = document.getElementById('materi').value;
            const fase = document.getElementById('fase').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const jenis = document.getElementById('jenisSoal').value;

            if (!key) {
                alert("Waduh, isi dulu API Key Gemini-nya di pojok kanan atas, Lur!");
                return;
            }
            if (!materi) {
                alert("Isi dulu materinya mau tentang apa.");
                return;
            }

            // Tampilkan Loading
            document.getElementById('loadingArea').classList.remove('hidden');
            document.getElementById('hasilArea').classList.add('hidden');
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnGenerate').innerText = "Sedang Memproses...";

            const prompt = `Anda adalah asisten pembuat soal ujian profesional. 
            Buatkan 5 soal ${jenis} tentang materi: "${materi}". 
            Untuk Mata Pelajaran: ${mapel}, Tingkat: ${fase}, Kesulitan: ${level}.
            Berikan juga Kunci Jawaban di bagian paling bawah. 
            Gunakan format penomoran yang rapi.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const teksHasil = data.candidates[0].content.parts[0].text;

                // Tampilkan Hasil
                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('hasilArea').classList.remove('hidden');
                document.getElementById('kontenSoal').innerText = teksHasil;
                document.getElementById('labelHasil').innerText = `${mapel} - ${fase} (${level})`;
                
                // Scroll ke hasil
                window.scrollTo({ top: document.getElementById('hasilArea').offsetTop - 50, behavior: 'smooth' });

            } catch (error) {
                alert("Gagal konek ke AI: " + error.message);
                document.getElementById('loadingArea').classList.add('hidden');
            } finally {
                document.getElementById('btnGenerate').disabled = false;
                document.getElementById('btnGenerate').innerHTML = '<i class="fas fa-magic"></i> Buat Soal Sekarang';
            }
        }
    </script>
</body>
</html>
