<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Quiz Generator FINAL</title>

<style>
body {font-family:Arial;background:#111;color:#fff;padding:20px;}
.container {max-width:900px;margin:auto;}
input,select,button {
 width:100%;margin-top:10px;padding:10px;border-radius:8px;border:none;
}
button {background:#00c6ff;color:white;font-weight:bold;}
.soal {margin-top:20px;padding:15px;background:#222;border-radius:10px;}
img {width:100%;margin-top:10px;border-radius:10px;}
</style>
</head>

<body>

<div class="container">
<h2>AI Quiz Generator 🔥</h2>

<input type="password" id="apiKey" placeholder="API Key">

<select id="jenjang">
<option value="">Pilih Jenjang</option>
<option>SD</option>
<option>SMP</option>
<option>SMA</option>
</select>

<select id="mapel"></select>
<select id="kelas"></select>
<select id="materi"></select>

<select id="bentuk">
<option>Pilihan Ganda</option>
<option>Benar/Salah</option>
<option>Essay</option>
</select>

<input type="number" id="opsi" placeholder="Jumlah opsi PG (default 4)">
<input type="number" id="jumlah" placeholder="Jumlah soal max 20">

<label><input type="checkbox" id="gambar"> Soal Bergambar</label>

<button onclick="generate()">Generate</button>

<div id="output"></div>
</div>

<script>

// ===== DATABASE LENGKAP
const data = {

SD:{
 "Matematika":{
  "1":["Bilangan","Penjumlahan","Pengurangan"],
  "2":["Perkalian","Pembagian"],
  "3":["Pecahan","Luas"],
  "4":["FPB","KPK"],
  "5":["Volume","Skala"],
  "6":["Statistika","Debit"]
 },
 "IPA":{
  "4":["Gaya","Energi"],
  "5":["Organ","Ekosistem"],
  "6":["Listrik","Tata Surya"]
 },
 "Bahasa Indonesia":{
  "4":["Deskripsi","Narasi"],
  "5":["Pidato","Iklan"],
  "6":["Laporan","Argumentasi"]
 }
},

SMP:{
 "Matematika":{
  "7":["Aljabar","Himpunan"],
  "8":["SPLDV","Peluang"],
  "9":["Statistika","Bangun Ruang"]
 },
 "IPA":{
  "7":["Zat","Energi"],
  "8":["Tekanan","Pernapasan"],
  "9":["Listrik","Magnet"]
 },
 "Bahasa Inggris":{
  "7":["Present"],
  "8":["Past"],
  "9":["Narrative"]
 }
},

SMA:{
 "Matematika":{
  "10":["Eksponen","Logaritma"],
  "11":["Limit","Turunan"],
  "12":["Integral","Peluang"]
 },
 "Fisika":{
  "10":["Gerak","Newton"],
  "11":["Fluida","Gelombang"],
  "12":["Listrik","Magnet"]
 },
 "Kimia":{
  "10":["Atom","Ikatan"],
  "11":["Reaksi","Kesetimbangan"],
  "12":["Asam Basa"]
 }
}

};

// ===== DROPDOWN
const jenjang = document.getElementById("jenjang");
const mapel = document.getElementById("mapel");
const kelas = document.getElementById("kelas");
const materi = document.getElementById("materi");

jenjang.onchange=()=>{
 mapel.innerHTML="";kelas.innerHTML="";materi.innerHTML="";
 Object.keys(data[jenjang.value]||{}).forEach(m=>{
  mapel.add(new Option(m,m));
 });
};

mapel.onchange=()=>{
 kelas.innerHTML="";materi.innerHTML="";
 Object.keys(data[jenjang.value][mapel.value]).forEach(k=>{
  kelas.add(new Option(k,k));
 });
};

kelas.onchange=()=>{
 materi.innerHTML="";
 data[jenjang.value][mapel.value][kelas.value].forEach(m=>{
  materi.add(new Option(m,m));
 });
};

// ===== PARSE
function parseJSON(text){
 try{return JSON.parse(text);}
 catch{
  let m=text.match(/\[\s*{[\s\S]*}\s*\]/);
  if(m) return JSON.parse(m[0]);
 }
 return null;
}

// ===== GENERATE
async function generate(){

 let apiKey = document.getElementById("apiKey").value;
 let bentuk = document.getElementById("bentuk").value;
 let jumlah = parseInt(document.getElementById("jumlah").value);
 let opsi = document.getElementById("opsi").value || 4;
 let gambar = document.getElementById("gambar").checked;
 let output = document.getElementById("output");

 if(!apiKey) return alert("Isi API key");
 if(jumlah>20) return alert("Max 20 soal");

 output.innerHTML="Loading...";

 let instruksi = "";

 if(bentuk==="Essay"){
  instruksi="Buat soal essay tanpa opsi.";
 }
 else if(bentuk==="Benar/Salah"){
  instruksi="Opsi hanya Benar dan Salah.";
 }
 else{
  instruksi=`Buat pilihan ganda dengan ${opsi} opsi.`;
 }

 let res = await fetch("https://api.openai.com/v1/chat/completions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer "+apiKey,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"gpt-4o-mini",
   messages:[{
    role:"user",
    content:`
Kurikulum sekolah Indonesia.

Jenjang: ${jenjang.value}
Mapel: ${mapel.value}
Kelas: ${kelas.value}
Materi: ${materi.value}

${instruksi}

WAJIB JSON:
[
{"soal":"","opsi":["..."],"jawaban":"","deskripsi_gambar":""}
]
`
   }]
  })
 });

 let dataAI = await res.json();
 let soal = parseJSON(dataAI.choices[0].message.content);

 if(!soal){
  output.innerHTML="❌ Error AI";
  return;
 }

 output.innerHTML="";

 for(let i=0;i<soal.length;i++){
  let s = soal[i];

  let html = `<div class="soal"><b>${i+1}. ${s.soal}</b>`;

  if(bentuk!=="Essay" && s.opsi){
    s.opsi.forEach(o=>html+=`<div>- ${o}</div>`);
  }

  html+=`<br><i>Jawaban: ${s.jawaban}</i>`;

  if(gambar){
   let imgRes = await fetch("https://api.openai.com/v1/images/generations",{
    method:"POST",
    headers:{
     "Authorization":"Bearer "+apiKey,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     model:"gpt-image-1",
     prompt:s.deskripsi_gambar || "ilustrasi pendidikan",
     size:"512x512"
    })
   });

   let imgData = await imgRes.json();
   html+=`<img src="${imgData.data[0].url}">`;
  }

  html+=`</div>`;
  output.innerHTML+=html;
 }

}

</script>

</body>
</html>
