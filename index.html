<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat Soal Otomatis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <div class="flex justify-between items-center mb-8 max-w-6xl mx-auto">
        <div class="flex items-center">
            <div class="bg-indigo-600 p-2 rounded-xl mr-3 text-white">
                <i class="fas fa-brain text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-indigo-900">Pembuat Soal Otomatis</h1>
                <p class="text-xs text-gray-500 italic">Generator Soal: Formatif, Sumatif, STS, SAS, dsb.</p>
            </div>
        </div>
        <button onclick="toggleModal()" class="flex items-center gap-2 bg-emerald-50 text-emerald-600 px-4 py-2 rounded-full border border-emerald-200 hover:bg-emerald-100 transition">
            <i class="fas fa-cog"></i>
            <span class="text-sm font-semibold">Pengaturan API</span>
        </button>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 mb-6 text-indigo-700 font-bold uppercase text-sm tracking-wider">
                <i class="fas fa-sliders-h"></i> Konfigurasi Tipe Soal
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 block mb-1 uppercase">Jenis Soal</label>
                    <select id="jenisSoal" class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:border-indigo-500">
                        <option>Pilihan Ganda</option>
                        <option>Benar Salah</option>
                        <option>Isian Singkat</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 block mb-1 uppercase">Jumlah Opsi</label>
                        <select id="jumlahOpsi" class="w-full p-3 bg-gray-50 border rounded-xl outline-none">
                            <option>4 Opsi</option>
                            <option>5 Opsi</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-400 block mb-2 uppercase text-center">Fase & Kelas</label>
                    <select id="kelas" class="w-full p-3 bg-gray-50 border rounded-xl outline-none">
                        <option>Kelas 7</option>
                        <option>Kelas 8</option>
                        <option>Kelas 9</option>
                        <option>Kelas 10</option>
                        <option>Kelas 11</option>
                        <option>Kelas 12</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <div class="flex items-center gap-2 mb-6 text-indigo-700 font-bold uppercase text-sm tracking-wider">
                <i class="fas fa-star"></i> Level & Fitur
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="gambarAi" class="w-5 h-5 accent-indigo-600">
                        <label for="gambarAi" class="text-sm font-semibold flex items-center gap-2">
                            <i class="far fa-image text-indigo-500"></i> Gambar Ilustrasi AI
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="teksLiterasi" class="w-5 h-5 accent-indigo-600">
                        <label for="teksLiterasi" class="text-sm font-semibold flex items-center gap-2">
                            <i class="far fa-file-alt text-indigo-500"></i> Teks Wacana (Literasi)
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="tambahKeStruktur()" class="w-full mt-8 bg-indigo-600 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition">
                <i class="fas fa-plus"></i> Tambahkan ke Daftar Struktur
            </button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto mt-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex items-center gap-2 mb-6 text-indigo-700 font-bold uppercase text-sm tracking-wider">
            <i class="fas fa-list-ol"></i> Struktur Naskah Akhir
        </div>
        
        <div id="daftarStruktur" class="space-y-3 min-h-[100px] bg-gray-50/50 p-4 rounded-xl border-2 border-dashed border-gray-200">
            </div>

        <button class="w-full mt-6 bg-indigo-500 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-600 shadow-lg shadow-indigo-100 transition">
            <i class="fas fa-magic"></i> Buat Naskah Soal
        </button>
    </div>

    <div id="modalApi" class="modal">
        <div class="bg-white p-8 rounded-3xl w-[400px] shadow-2xl relative">
            <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-key text-yellow-500"></i> Pengaturan API Key
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">API Key Gemini</label>
                    <input type="password" id="apiGemini" placeholder="AI-..." class="w-full p-3 bg-gray-100 border rounded-xl outline-none mt-1">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">API Key Gambar (Flux/DALL-E)</label>
                    <input type="password" id="apiGambar" placeholder="sk-..." class="w-full p-3 bg-gray-100 border rounded-xl outline-none mt-1">
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button onclick="toggleModal()" class="flex-1 py-3 border border-gray-200 rounded-xl font-bold text-gray-600">Batal</button>
                <button onclick="simpanApi()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // Logika Modal
        function toggleModal() {
            document.getElementById('modalApi').classList.toggle('active');
        }

        function simpanApi() {
            alert('API Key tersimpan secara lokal!');
            toggleModal();
        }

        // Logika Tambah ke Daftar Struktur
        function tambahKeStruktur() {
            const jenis = document.getElementById('jenisSoal').value;
            const kelas = document.getElementById('kelas').value;
            const list = document.getElementById('daftarStruktur');

            const item = document.createElement('div');
            item.className = "flex items-center justify-between p-4 bg-white border rounded-xl shadow-sm hover:border-indigo-300 transition group";
            item.innerHTML = `
                <div class="flex items-center gap-4">
                    <span class="bg-indigo-50 text-indigo-600 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm">
                        ${list.children.length + 1}
                    </span>
                    <div>
                        <div class="font-bold text-gray-800">${jenis}</div>
                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-tight">${kelas} • 4 SOAL • C3, C4 • 2 GAMBAR</div>
                    </div>
                </div>
                <button onclick="this.parentElement.remove()" class="text-gray-300 hover:text-red-500 transition px-2">
                    <i class="fas fa-trash-alt"></i>
                </button>
            `;
            
            list.appendChild(item);
        }
    </script>
</body>
</html>
