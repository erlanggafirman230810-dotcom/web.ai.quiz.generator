<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator Soal - Full Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white; p: 0; } .card { box-shadow: none; border: none; } }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1600px] mx-auto mb-6 no-print">
        <div class="card p-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-indigo-900 text-white border-none">
            <div class="flex items-center gap-3">
                <i class="fas fa-robot text-3xl text-indigo-300"></i>
                <h1 class="text-xl font-bold tracking-tight">AI Pembuat Soal Otomatis</h1>
            </div>
            <div class="flex flex-wrap gap-4 items-center">
                <div class="text-xs">
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-300 underline block mb-1">Ambil Key Gemini (Gratis)</a>
                    <input type="password" id="geminiKey" placeholder="Paste Key Gemini..." class="text-gray-800 rounded px-3 py-1 outline-none w-44">
                </div>
                <div class="text-xs">
                    <a href="https://platform.openai.com/api-keys" target="_blank" class="text-emerald-300 underline block mb-1">Ambil Key OpenAI (Gambar)</a>
                    <input type="password" id="openaiKey" placeholder="Paste Key OpenAI..." class="text-gray-800 rounded px-3 py-1 outline-none w-44">
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6 no-print">
        
        <div class="lg:col-span-1 space-y-6">
            <div class="card p-5">
                <h2 class="font-bold text-indigo-700 mb-4 flex items-center gap-2 text-sm uppercase tracking-wide border-b pb-2">
                    <i class="fas fa-id-card"></i> Identitas Pelajaran
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 block uppercase">Mata Pelajaran</label>
                        <input type="text" id="mapel" placeholder="Contoh: IPA, PAI, Javanese" class="w-full border-b rounded-none p-1 text-sm focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 block uppercase">Fase & Kelas</label>
                        <select id="kelas" class="w-full border-b p-1 text-sm outline-none">
                            <option>Fase D - Kelas 9</option>
                            <option>Fase D - Kelas 8</option>
                            <option>Fase D - Kelas 7</option>
                            <option>Fase E - Kelas 10</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card p-5">
                <h2 class="font-bold text-indigo-700 mb-4 flex items-center gap-2 text-sm uppercase tracking-wide border-b pb-2">
                    <i class="fas fa-sliders-h"></i> Tipe Soal & Level
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 block uppercase">Jenis Soal</label>
                        <select id="jenisSoal" class="w-full border-b p-1 text-sm outline-none">
                            <option value="Pilihan Ganda (4 Opsi)">Pilihan Ganda</option>
                            <option value="Uraian/Essay">Uraian / Essay</option>
                            <option value="Benar/Salah">Benar / Salah</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 block uppercase">Level Kognitif</label>
                        <div class="flex flex-col gap-2 mt-2 text-xs">
                            <label class="flex items-center gap-2"><input type="radio" name="level" value="L1 (Mengingat/Memahami)" checked> L1 (Pemahaman)</label>
                            <label class="flex items-center gap-2"><input type="radio" name="level" value="L2 (Mengaplikasikan)"> L2 (Aplikasi)</label>
                            <label class="flex items-center gap-2"><input type="radio" name="level" value="L3 (HOTS - Penalaran)"> L3 (Penalaran/HOTS)</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="card p-6 min-h-[400px] flex flex-col">
                <h2 class="font-bold text-indigo-700 mb-4 flex items-center gap-2 text-sm uppercase tracking-wide border-b pb-2">
                    <i class="fas fa-edit"></i> Materi, Konteks & Literasi
                </h2>
                <textarea id="materi" rows="12" placeholder="Masukkan materi, kisi-kisi, atau teks wacana bacaan di sini secara mendetail..." class="flex-grow w-full border rounded-lg p-4 outline-none focus:ring-2 focus:ring-indigo-400 text-sm leading-relaxed mb-4"></textarea>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex items-center justify-between p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                        <div class="flex items-center gap-2 text-emerald-700 text-xs font-bold">
                            <i class="fas fa-image"></i> Sertakan Gambar AI
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="checkGambar" class="sr-only peer">
                            <div class="w-10 h-5 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                        </label>
                    </div>

                    <button onclick="prosesUtama()" id="btnGenerate" class="bg-indigo-600 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all">
                        <i class="fas fa-wand-magic-sparkles"></i> BUAT SOAL
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div id="loadingArea" class="hidden card p-10 text-center">
                <div class="loader rounded-full border-4 h-12 w-12 mb-4 mx-auto"></div>
                <p id="loadingStatus" class="text-xs text-indigo-600 font-bold animate-pulse">Memproses...</p>
            </div>
            <div id="historySoal" class="card p-5 h-full max-h-[600px] overflow-y-auto">
                <h2 class="font-bold text-gray-500 mb-4 text-[10px] uppercase tracking-widest">Riwayat Hasil</h2>
                <p class="text-xs text-gray-400 italic">Belum ada soal yang dihasilkan.</p>
            </div>
        </div>
    </div>

    <div id="hasilArea" class="hidden max-w-5xl mx-auto mt-10 card p-12 border-t-[10px] border-indigo-600 mb-20 bg-white shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b pb-8 gap-4">
            <div class="text-center md:text-left">
                <h2 id="judulHasil" class="text-3xl font-black text-gray-900 leading-tight">NASKAH ASESMEN</h2>
                <p id="labelSub" class="text-gray-500 font-bold uppercase tracking-widest text-xs mt-1"></p>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="window.print()" class="bg-black text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 hover:opacity-80 transition-all text-sm">
                    <i class="fas fa-print"></i> CETAK KE PDF
                </button>
            </div>
        </div>
        
        <div id="kontenSoal" class="space-y-10 text-gray-800 font-serif text-lg leading-relaxed">
            </div>
    </div>

    <script>
        async function prosesUtama() {
            const gKey = document.getElementById('geminiKey').value;
            const oKey = document.getElementById('openaiKey').value;
            const materi = document.getElementById('materi').value;
            const mapel = document.getElementById('mapel').value || "Ujian Sekolah";
            const kelas = document.getElementById('kelas').value;
            const jenis = document.getElementById('jenisSoal').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const isGambar = document.getElementById('checkGambar').checked;

            if (!gKey) return alert("API Key Gemini belum diisi!");
            if (isGambar && !oKey) return alert("Key OpenAI diperlukan untuk gambar!");
            if (!materi) return alert("Materi kosong!");

            document.getElementById('loadingArea').classList.remove('hidden');
            document.getElementById('hasilArea').classList.add('hidden');
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('loadingStatus').innerText = "Gemini sedang meracik soal...";

            const prompt = `Anda adalah asisten pembuat soal ujian. Buatkan 5 soal ${jenis} tentang materi: "${materi}". 
            Gunakan level kognitif: ${level}. Untuk mata pelajaran ${mapel}, ${kelas}.
            BERIKAN HASIL HANYA JSON MURNI: [{"no":1, "soal":"...", "opsi":["A...","B...","C...","D..."], "kunci":"..."}]`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                const jsonRaw = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                const listSoal = JSON.parse(jsonRaw);

                const container = document.getElementById('kontenSoal');
                container.innerHTML = "";
                
                for (let s of listSoal) {
                    let imgHtml = "";
                    if (isGambar) {
                        document.getElementById('loadingStatus').innerText = `DALL-E menggambar soal ${s.no}...`;
                        const url = await buatGambar(oKey, s.soal);
                        if(url) imgHtml = `<img src="${url}" class="max-w-[350px] rounded-lg mt-4 border shadow-sm" />`;
                    }

                    container.innerHTML += `
                        <div class="border-b pb-8 last:border-0">
                            <p class="font-bold mb-3">${s.no}. ${s.soal}</p>
                            ${imgHtml}
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-2 mt-4 text-base font-sans">
                                ${s.opsi.map((o, i) => `<div>${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
                            </div>
                            <p class="text-[10px] text-gray-300 mt-4 italic no-print">Kunci: ${s.kunci}</p>
                        </div>
                    `;
                }

                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('hasilArea').classList.remove('hidden');
                document.getElementById('judulHasil').innerText = mapel;
                document.getElementById('labelSub').innerText = `${kelas} | ${level}`;
                window.scrollTo({ top: document.getElementById('hasilArea').offsetTop - 50, behavior: 'smooth' });

            } catch (e) {
                alert("Error: " + e.message);
                document.getElementById('loadingArea').classList.add('hidden');
            } finally {
                document.getElementById('btnGenerate').disabled = false;
            }
        }

        async function buatGambar(key, prompt) {
            try {
                const res = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model: "dall-e-3", prompt: `Black and white textbook style simple illustration of: ${prompt}. Minimalist, white background.`, size: "1024x1024" })
                });
                const data = await res.json();
                return data.data[0].url;
            } catch (err) { return ""; }
        }
    </script>
</body>
</html>
