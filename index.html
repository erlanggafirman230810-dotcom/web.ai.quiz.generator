<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator PRO</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  padding:20px;
}
.container {
  max-width:900px;
  margin:auto;
  background: rgba(255,255,255,0.1);
  padding:20px;
  border-radius:15px;
}
select,input,button {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  border:none;
}
button {
  background:#00c6ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.soal {
  margin-top:20px;
  padding:15px;
  background: rgba(255,255,255,0.2);
  border-radius:10px;
}
img {
  width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>AI Quiz Generator 🔥</h2>

<input type="password" id="apiKey" placeholder="API Key">

<select id="jenjang">
<option value="">Pilih Jenjang</option>
<option>SD</option>
<option>SMP</option>
<option>SMA</option>
</select>

<select id="mapel"></select>
<select id="kelas"></select>
<select id="materi"></select>

<input type="number" id="jumlah" max="10" placeholder="Jumlah Soal (max 10)">

<label>Soal Bergambar</label>
<input type="checkbox" id="gambar" checked>

<button onclick="generate()">Generate Soal</button>

<div id="output"></div>
</div>

<script>

// ===== DATABASE (SUPER FULL RINGKAS)
const data = {
SMA: {
 "Matematika": {
  "12":["Integral","Statistika","Peluang"]
 }
}
};

// ===== DROPDOWN
const jenjang = document.getElementById("jenjang");
const mapel = document.getElementById("mapel");
const kelas = document.getElementById("kelas");
const materi = document.getElementById("materi");
const output = document.getElementById("output");

jenjang.onchange = () => {
 mapel.innerHTML="";
 kelas.innerHTML="";
 materi.innerHTML="";
 Object.keys(data[jenjang.value]||{}).forEach(m=>{
  let o=document.createElement("option");
  o.textContent=m;
  mapel.appendChild(o);
 });
};

mapel.onchange = () => {
 kelas.innerHTML="";
 materi.innerHTML="";
 Object.keys(data[jenjang.value][mapel.value]).forEach(k=>{
  let o=document.createElement("option");
  o.textContent=k;
  kelas.appendChild(o);
 });
};

kelas.onchange = () => {
 materi.innerHTML="";
 data[jenjang.value][mapel.value][kelas.value].forEach(m=>{
  let o=document.createElement("option");
  o.textContent=m;
  materi.appendChild(o);
 });
};

// ===== PARSE AMAN
function extractJSON(text){
 try {
  return JSON.parse(text);
 } catch {
  try {
    const match = text.match(/\[\s*{[\s\S]*}\s*\]/);
    if(match) return JSON.parse(match[0]);
  } catch {}
  return null;
 }
}

// ===== GENERATE
async function generate(){
 const apiKey = document.getElementById("apiKey").value;

 output.innerHTML="Loading...";

 const res = await fetch("https://api.openai.com/v1/chat/completions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer "+apiKey,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"gpt-4o-mini",
   messages:[{
    role:"user",
    content:`
KELUARKAN HANYA JSON!

[
{"soal":"","opsi":["A","B","C","D"],"jawaban":"","deskripsi_gambar":""}
]

Buat ${jumlah.value} soal ${mapel.value} materi ${materi.value}.
`
   }]
  })
 });

 const dataAI = await res.json();
 const soalJSON = extractJSON(dataAI.choices[0].message.content);

 if(!soalJSON){
  output.innerHTML="❌ Error AI";
  return;
 }

 output.innerHTML="";

 for(let i=0;i<soalJSON.length;i++){
  let s = soalJSON[i];

  let html = `<div class="soal">
  <b>${i+1}. ${s.soal}</b>`;

  if(s.opsi){
    s.opsi.forEach(o=>{
      html += `<div>- ${o}</div>`;
    });
  }

  html += `<br><i>Jawaban: ${s.jawaban}</i>`;

  if(gambar.checked){
    const imgRes = await fetch("https://api.openai.com/v1/images/generations",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+apiKey,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"gpt-image-1",
        prompt:s.deskripsi_gambar,
        size:"512x512"
      })
    });

    const imgData = await imgRes.json();
    html += `<img src="${imgData.data[0].url}">`;
  }

  html += `</div>`;
  output.innerHTML += html;
 }
}

</script>

</body>
</html>
