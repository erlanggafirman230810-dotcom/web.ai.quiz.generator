<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Quiz Generator PRO</title>

<style>
body {font-family:Arial;background:#111;color:#fff;transition:0.3s;}
.light {background:#f5f5f5;color:#000;}
.container {max-width:900px;margin:auto;padding:20px;}
select,input,button {width:100%;margin-top:10px;padding:10px;border-radius:8px;}
button {background:#00c6ff;color:white;cursor:pointer;}
.soal {margin-top:20px;padding:15px;background:rgba(255,255,255,0.1);border-radius:10px;}
img {width:100%;margin-top:10px;border-radius:10px;}
</style>
</head>

<body>

<div class="container">
<h2>AI Quiz Generator 🔥</h2>

<input type="password" id="apiKey" placeholder="API Key">

<select id="bentuk" onchange="updateOpsi()">
<option>Pilihan Ganda</option>
<option>Pilihan Ganda Kompleks</option>
<option>Benar/Salah</option>
<option>Essay</option>
</select>

<input type="number" id="opsi" placeholder="Jumlah opsi (PG)" value="4">

<input type="number" id="jumlah" placeholder="Jumlah soal max 20">

<label><input type="checkbox" id="gambar"> Soal Bergambar</label>

<button onclick="toggleMode()">Dark / Light</button>
<button onclick="generate()">Generate</button>

<div id="output"></div>
</div>

<script>

// DARK MODE
function toggleMode(){
 document.body.classList.toggle("light");
}

// HANDLE OPSI
function updateOpsi(){
 let bentuk = document.getElementById("bentuk").value;
 let opsi = document.getElementById("opsi");

 if(bentuk==="Essay"){
  opsi.disabled=true;
  opsi.value="";
 }
 else if(bentuk==="Benar/Salah"){
  opsi.disabled=true;
  opsi.value=2;
 }
 else if(bentuk==="Pilihan Ganda Kompleks"){
  opsi.disabled=false;
  opsi.value=5;
 }
 else{
  opsi.disabled=false;
  opsi.value=4;
 }
}

// PARSE JSON
function extractJSON(text){
 try{return JSON.parse(text);}
 catch{
  let m=text.match(/\[\s*{[\s\S]*}\s*\]/);
  if(m) return JSON.parse(m[0]);
 }
 return null;
}

// GENERATE
async function generate(){
 let apiKey = document.getElementById("apiKey").value;
 let bentuk = document.getElementById("bentuk").value;
 let opsi = document.getElementById("opsi").value;
 let jumlah = parseInt(document.getElementById("jumlah").value);
 let gambar = document.getElementById("gambar").checked;
 let output = document.getElementById("output");

 if(jumlah>20){alert("Max 20");return;}

 output.innerHTML="Loading...";

 let res = await fetch("https://api.openai.com/v1/chat/completions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer "+apiKey,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"gpt-4o-mini",
   messages:[{
    role:"user",
    content:`
Buat ${jumlah} soal tipe ${bentuk}.

${bentuk==="Essay" ? "Tanpa opsi." : ""}
${bentuk==="Benar/Salah" ? "Opsi hanya Benar dan Salah." : ""}
${bentuk.includes("Pilihan") ? `Jumlah opsi: ${opsi}` : ""}

FORMAT JSON:
[
{"soal":"","opsi":["..."],"jawaban":"","deskripsi_gambar":""}
]
`
   }]
  })
 });

 let data = await res.json();
 let soal = extractJSON(data.choices[0].message.content);

 if(!soal){
  output.innerHTML="❌ Error parsing AI";
  return;
 }

 output.innerHTML="";

 for(let i=0;i<soal.length;i++){
  let s = soal[i];

  let html = `<div class="soal"><b>${i+1}. ${s.soal}</b>`;

  if(bentuk!=="Essay" && s.opsi){
    s.opsi.forEach(o=>{
      html+=`<div>- ${o}</div>`;
    });
  }

  html+=`<br><i>Jawaban: ${s.jawaban}</i>`;

  if(gambar){
    let img = await fetch("https://api.openai.com/v1/images/generations",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+apiKey,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"gpt-image-1",
        prompt:s.deskripsi_gambar || "ilustrasi edukasi",
        size:"512x512"
      })
    });

    let imgData = await img.json();
    html+=`<img src="${imgData.data[0].url}">`;
  }

  html+=`</div>`;
  output.innerHTML+=html;
 }
}

updateOpsi();

</script>

</body>
</html>
