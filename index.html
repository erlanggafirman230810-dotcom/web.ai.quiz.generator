<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pembuat Soal + Ilustrasi Gambar - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .soal-item { border-bottom: 1px solid #e5e7eb; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .soal-item:last-child { border-bottom: none; }
        .img-preview { max-width: 300px; border-radius: 8px; margin-top: 1rem; display: none; border: 2px solid #e5e7eb; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b pb-6">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-3 rounded-xl text-white shadow-md">
                <i class="fas fa-brain text-3xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-gray-900">AI Super Generator Soal</h1>
                <p class="text-sm text-gray-500">Buat Teks Soal (Gemini) & Ilustrasi Gambar (DALL-E) Otomatis</p>
            </div>
        </div>
        <div class="flex flex-col gap-2 w-full md:w-auto">
            <input type="password" id="geminiKey" placeholder="Tempel API Key Gemini..." class="text-xs border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-300 w-full md:w-64" required>
            <input type="password" id="openaiKey" placeholder="Tempel API Key OpenAI (DALL-E)..." class="text-xs border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-emerald-300 w-full md:w-64" required>
        </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 space-y-6">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-xs tracking-wider">
                    <i class="fas fa-id-card text-indigo-500"></i> Identitas
                </h2>
                <div class="space-y-3">
                    <input type="text" id="mapel" placeholder="Mata Pelajaran (misal: Biologi)" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="fase" class="w-full border rounded-lg p-2 text-sm outline-none">
                            <option value="Fase D (SMP)">Fase D (SMP)</option>
                            <option value="Fase E (SMA 10)">Fase E (SMA 10)</option>
                        </select>
                        <select id="kelas" class="w-full border rounded-lg p-2 text-sm outline-none">
                            <option value="9">Kelas 9</option>
                            <option value="8">Kelas 8</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-xs tracking-wider">
                    <i class="fas fa-sliders-h text-indigo-500"></i> Tipe Soal
                </h2>
                <div class="space-y-3">
                    <select id="jenisSoal" class="w-full border rounded-lg p-2 text-sm outline-none">
                        <option value="Pilihan Ganda (4 opsi)">Pilihan Ganda</option>
                        <option value="Uraian">Uraian/Essay</option>
                    </select>
                    <div class="flex items-center justify-between text-xs text-gray-600 font-medium border-t pt-3">
                        <span>Kesulitan:</span>
                        <div class="flex gap-2">
                            <label class="flex items-center gap-1"><input type="radio" name="level" value="Mudah" checked> Mudah</label>
                            <label class="flex items-center gap-1"><input type="radio" name="level" value="Sedang"> Sedang</label>
                            <label class="flex items-center gap-1"><input type="radio" name="level" value="Sulit"> Sulit</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="card p-6">
                <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-xs tracking-wider">
                    <i class="fas fa-edit text-indigo-500"></i> Materi & Cakupan Soal
                </h2>
                <textarea id="materi" rows="6" placeholder="Masukkan materi, kisi-kisi, atau teks wacana di sini secara detail..." class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-400 mb-4 text-sm"></textarea>
                
                <button onclick="generateTeksSoal()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-lg">
                    <i class="fas fa-magic"></i> Buat Naskah Soal (via Gemini)
                </button>
            </div>
        </div>
    </div>

    <div id="loadingTeks" class="hidden max-w-6xl mx-auto mt-12 text-center card p-10">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
        <p class="text-indigo-600 font-semibold animate-pulse">Gemini AI sedang menyusun soal...</p>
    </div>

    <div id="hasilArea" class="hidden max-w-6xl mx-auto mt-10 card p-8 border-t-8 border-indigo-600">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 class="text-3xl font-extrabold text-gray-900">Naskah Soal Final</h2>
                <p id="labelHasil" class="text-sm text-gray-500 font-medium"></p>
            </div>
            <button onclick="window.print()" class="bg-gray-800 hover:bg-black text-white px-5 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm">
                <i class="fas fa-print"></i> Cetak / PDF
            </button>
        </div>
        
        <div id="kontenSoal" class="text-gray-800 leading-relaxed font-serif text-lg space-y-8">
            </div>
    </div>

    <script>
        // --- FUNGSI UTAMA: GENERATE TEKS SOAL (GEMINI) ---
        async function generateTeksSoal() {
            const geminiKey = document.getElementById('geminiKey').value;
            const mapel = document.getElementById('mapel').value || "Mata Pelajaran";
            const materi = document.getElementById('materi').value;
            const fase = document.getElementById('fase').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const jenis = document.getElementById('jenisSoal').value;

            if (!geminiKey) { alert("Isi dulu API Key Gemini di pojok kanan atas, Lur!"); return; }
            if (!materi) { alert("Isi materi soalnya dulu."); return; }

            // Loading state
            document.getElementById('loadingTeks').classList.remove('hidden');
            document.getElementById('hasilArea').classList.add('hidden');
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnGenerate').innerText = "Sedang Memproses...";

            // Prompt khusus agar Gemini mengembalikan JSON rapi per nomor
            const prompt = `Anda adalah penulis soal ujian profesional. Buatkan 5 soal ${jenis} tentang materi: "${materi}". 
            Untuk Mapel: ${mapel}, Tingkat: ${fase}, Kesulitan: ${level}.
            BERIKAN HASIL DALAM FORMAT JSON SAJA, tanpa teks tambahan.
            Format JSON harus berupa array of objects: 
            [
              {
                "nomor": 1,
                "teksSoal": "Isi teks soal...",
                "pilihan": ["A...", "B...", "C...", "D..."], // Kosongkan jika Uraian
                "kunci": "Jawaban benar..."
              },
              ...
            ]`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                // Parsing hasil JSON dari Gemini
                const rawText = data.candidates[0].content.parts[0].text;
                const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                const soalArray = JSON.parse(cleanJson);

                renderSoal(soalArray); // Panggil fungsi buat nampilin soal

                document.getElementById('loadingTeks').classList.add('hidden');
                document.getElementById('hasilArea').classList.remove('hidden');
                document.getElementById('labelHasil').innerText = `${mapel} - ${fase} (${level})`;
                window.scrollTo({ top: document.getElementById('hasilArea').offsetTop - 20, behavior: 'smooth' });

            } catch (error) {
                alert("Gagal konek ke Gemini AI: " + error.message);
                document.getElementById('loadingTeks').classList.add('hidden');
            } finally {
                document.getElementById('btnGenerate').disabled = false;
                document.getElementById('btnGenerate').innerHTML = '<i class="fas fa-magic"></i> Buat Naskah Soal (via Gemini)';
            }
        }

        // --- FUNGSI RENDER SOAL KE HTML (DENGAN TOMBOL GAMBAR) ---
        function renderSoal(soalArray) {
            const container = document.getElementById('kontenSoal');
            container.innerHTML = ""; // Bersihkan hasil sebelumnya

            soalArray.forEach((soal, index) => {
                let pilihanHtml = "";
                if (soal.pilihan && soal.pilihan.length > 0) {
                    pilihanHtml = `<div class="grid grid-cols-2 gap-x-6 gap-y-2 mt-3 text-base font-sans">
                        ${soal.pilihan.map((p, i) => `<div>${String.fromCharCode(65+i)}. ${p}</div>`).join('')}
                    </div>`;
                }

                const soalHtml = `
                    <div class="soal-item" id="soal-${soal.nomor}">
                        <p class="font-sans font-medium text-gray-900">${soal.nomor}. ${soal.teksSoal}</p>
                        ${pilihanHtml}
                        
                        <img id="img-soal-${soal.nomor}" class="img-preview" alt="Ilustrasi Soal ${soal.nomor}" />
                        <div id="loading-img-${soal.nomor}" class="hidden text-emerald-600 text-sm mt-2 animate-pulse">
                            <i class="fas fa-spinner animate-spin"></i> Menghasilkan gambar via DALL-E...
                        </div>

                        <div class="mt-4 flex gap-2 no-print">
                            <button onclick="generateGambarSoal(${soal.nomor}, '${soal.teksSoal.replace(/'/g, "\\'")}')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-bold px-4 py-2 rounded-full flex items-center gap-1.5 transition-colors">
                                <i class="fas fa-image"></i> Buat Gambar Ilustrasi (DALL-E)
                            </button>
                            <span class="text-xs text-gray-400 mt-2">(Kunci: ${soal.kunci})</span>
                        </div>
                    </div>
                `;
                container.innerHTML += soalHtml;
            });
        }

        // --- FUNGSI GENERATE GAMBAR (DALL-E) ---
        async function generateGambarSoal(nomorSoal, deskripsiSoal) {
            const openaiKey = document.getElementById('openaiKey').value;
            const imgElement = document.getElementById(`img-soal-${nomorSoal}`);
            const loadingElement = document.getElementById(`loading-img-${nomorSoal}`);

            if (!openaiKey) { alert("Isi dulu API Key OpenAI (DALL-E) di atas, Lur!"); return; }

            // Tampilkan Loading Gambar
            loadingElement.classList.remove('hidden');
            imgElement.style.display = 'none';

            // Prompt Gambar: Buat instruksi agar DALL-E bikin gambar gaya ilustrasi buku sekolah yang jelas
            const imagePrompt = `A clear, simple educational illustration suitable for a school exam question about: ${deskripsiSoal}. High quality, white background, no text inside image.`;

            try {
                const response = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${openaiKey}`
                    },
                    body: JSON.stringify({
                        model: "dall-e-3", // Pakai DALL-E 3 buat hasil terbaik
                        prompt: imagePrompt,
                        n: 1,
                        size: "1024x1024"
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const imageUrl = data.data[0].url;

                // Tampilkan Gambar Hasil
                imgElement.src = imageUrl;
                imgElement.style.display = 'block'; // Tampilkan gambarnya

            } catch (error) {
                alert(`Gagal membuat gambar soal ${nomorSoal}: ` + error.message);
            } finally {
                loadingElement.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
