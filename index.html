<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Soal AI - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .kognitif-btn { @apply border border-gray-200 rounded-2xl p-4 text-center cursor-pointer transition-all duration-200 bg-white flex flex-col items-center justify-center gap-1; }
        .kognitif-btn.active { @apply bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-200 scale-[1.02]; }
        .kognitif-btn span { @apply text-[10px] font-bold opacity-60 uppercase tracking-widest; }
        .kognitif-btn strong { @apply text-sm font-bold; }
        .input-number { @apply border border-gray-300 rounded-lg p-1.5 w-16 text-center text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 transition-all; }
        .modal-active { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        #hasilSoal { white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="apiModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-md shadow-2xl modal-active text-left">
            <div class="flex justify-between items-center mb-8">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-100 p-2.5 rounded-xl text-indigo-600"><i data-lucide="settings-2" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-extrabold text-slate-800 tracking-tight">Konfigurasi API</h3>
                </div>
                <button onclick="toggleModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 block text-left">Google Gemini API Key</label>
                    <input type="password" id="gemini_key" placeholder="AIzaSy..." class="w-full px-4 py-3.5 bg-slate-50 rounded-2xl text-sm focus:ring-4 focus:ring-indigo-50 outline-none border-none">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 block text-left">OpenAI (DALL-E 3) API Key</label>
                    <input type="password" id="openai_key" placeholder="sk-..." class="w-full px-4 py-3.5 bg-slate-50 rounded-2xl text-sm focus:ring-4 focus:ring-indigo-50 outline-none border-none">
                </div>
                <button onclick="saveApiKeys()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-xl active:scale-[0.98]">Simpan Konfigurasi</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-6 md:p-10 rounded-[3rem] shadow-2xl border border-slate-100">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12 border-b border-slate-50 pb-8">
            <div class="flex items-center gap-5">
                <div class="bg-indigo-600 p-4 rounded-[1.5rem] text-white shadow-2xl shadow-indigo-200"><i data-lucide="zap" class="w-8 h-8 fill-current"></i></div>
                <div class="text-left">
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tighter">Generator Soal Otomatis</h1>
                    <p class="text-slate-500 font-medium">Buat paket soal cerdas berbasis AI dengan mudah</p>
                </div>
            </div>
            <button onclick="toggleModal()" class="p-3.5 bg-slate-50 text-slate-600 rounded-2xl hover:bg-indigo-50 hover:text-indigo-600 transition-all border border-slate-100"><i data-lucide="settings" class="w-6 h-6"></i></button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="space-y-10">
                <section>
                    <h2 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-4 text-left">Identitas Soal</h2>
                    <input type="text" id="mapel" placeholder="Ketik Mata Pelajaran..." class="w-full p-4 border-none bg-slate-50 rounded-2xl outline-none focus:ring-4 focus:ring-indigo-50 text-sm font-semibold mb-4">
                    <select id="kelas" class="w-full p-4 border-none bg-slate-50 rounded-2xl outline-none focus:ring-4 focus:ring-indigo-50 text-sm font-semibold cursor-pointer">
                        <option value="" disabled selected>Pilih Jenjang / Kelas</option>
                        <optgroup label="SD / MI">
                            <option>Kelas 1 SD/MI</option><option>Kelas 6 SD/MI</option>
                        </optgroup>
                        <optgroup label="SMP / MTs">
                            <option>Kelas 7 SMP/MTs</option><option>Kelas 8 SMP/MTs</option><option>Kelas 9 SMP/MTs</option>
                        </optgroup>
                        <optgroup label="SMA / SMK / MA">
                            <option>Kelas 10 SMA/SMK/MA</option><option>Kelas 11 SMA/SMK/MA</option><option>Kelas 12 SMA/SMK/MA</option>
                        </optgroup>
                    </select>
                </section>

                <section>
                    <h2 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-4 text-left">Tipe & Kesulitan</h2>
                    <div class="bg-slate-50 p-6 rounded-[2rem] space-y-4">
                        <div class="flex items-center justify-between"><label class="text-sm font-bold text-slate-700 cursor-pointer flex gap-2"><input type="checkbox" id="checkMudah"> Mudah</label><input type="number" id="numMudah" value="0" class="input-number"></div>
                        <div class="flex items-center justify-between"><label class="text-sm font-bold text-slate-700 cursor-pointer flex gap-2"><input type="checkbox" id="checkSedang" checked> Sedang</label><input type="number" id="numSedang" value="2" class="input-number"></div>
                        <div class="flex items-center justify-between"><label class="text-sm font-bold text-slate-700 cursor-pointer flex gap-2"><input type="checkbox" id="checkSulit" checked> Sulit</label><input type="number" id="numSulit" value="2" class="input-number"></div>
                    </div>
                </section>
            </div>

            <div class="space-y-10">
                <section>
                    <h2 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-4 text-left">Cakupan Materi</h2>
                    <textarea id="materiInput" class="w-full h-32 p-5 bg-slate-50 border-none rounded-[2rem] outline-none focus:ring-4 focus:ring-indigo-50 text-sm font-medium resize-none" placeholder="Tuliskan topik atau materi di sini..."></textarea>
                </section>

                <section>
                    <h2 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-4 text-left">Kognitif & Ekstra</h2>
                    <div class="grid grid-cols-3 gap-3 mb-8">
                        <div class="kognitif-btn" data-val="C1" onclick="this.classList.toggle('active')"><span>C1</span><strong>Mengingat</strong></div>
                        <div class="kognitif-btn" data-val="C2" onclick="this.classList.toggle('active')"><span>C2</span><strong>Memahami</strong></div>
                        <div class="kognitif-btn active" data-val="C3" onclick="this.classList.toggle('active')"><span>C3</span><strong>Menerapkan</strong></div>
                        <div class="kognitif-btn active" data-val="C4" onclick="this.classList.toggle('active')"><span>C4</span><strong>Menganalisis</strong></div>
                        <div class="kognitif-btn" data-val="C5" onclick="this.classList.toggle('active')"><span>C5</span><strong>Mengevaluasi</strong></div>
                        <div class="kognitif-btn" data-val="C6" onclick="this.classList.toggle('active')"><span>C6</span><strong>Mencipta</strong></div>
                    </div>
                    <div class="space-y-3">
                        <div class="p-4 bg-white border border-slate-100 rounded-2xl flex items-center justify-between"><label class="flex items-center gap-3 text-sm font-bold"><input type="checkbox" id="checkGambar"> Pakai Gambar AI</label><input type="number" id="numGambar" value="0" class="input-number"></div>
                        <div class="p-4 bg-white border border-slate-100 rounded-2xl flex items-center justify-between"><label class="flex items-center gap-3 text-sm font-bold"><input type="checkbox" id="checkWacana"> Sertakan Wacana</label><input type="number" id="numWacana" value="0" class="input-number"></div>
                    </div>
                </section>

                <button id="btnGenerate" onclick="jalankanAI()" class="w-full bg-indigo-600 text-white font-extrabold py-5 rounded-[2rem] shadow-2xl hover:bg-indigo-700 transition-all active:scale-[0.97] flex items-center justify-center gap-3 text-lg">
                    <i data-lucide="sparkles" class="w-6 h-6"></i> Buat Naskah Soal
                </button>
            </div>
        </div>

        <div id="containerHasil" class="hidden mt-12 p-8 bg-slate-900 rounded-[2rem] text-slate-100 text-left">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-xl flex items-center gap-2"><i data-lucide="file-text" class="text-indigo-400"></i> Naskah Soal Berhasil Dibuat</h3>
                <button onclick="copyHasil()" class="bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-400">Salin Semua</button>
            </div>
            <div id="hasilSoal" class="text-sm leading-relaxed"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const apiModal = document.getElementById('apiModal');

        function toggleModal() { apiModal.classList.toggle('hidden'); }
        function saveApiKeys() {
            localStorage.setItem('GEMINI_KEY', document.getElementById('gemini_key').value);
            localStorage.setItem('OPENAI_KEY', document.getElementById('openai_key').value);
            alert('API Key tersimpan!'); toggleModal();
        }

        async function jalankanAI() {
            const apiKey = localStorage.getItem('GEMINI_KEY');
            if (!apiKey) { alert("Harap isi API Key Gemini di pengaturan gerigi!"); toggleModal(); return; }

            const mapel = document.getElementById('mapel').value;
            const materi = document.getElementById('materiInput').value;
            const kelas = document.getElementById('kelas').value;
            if (!mapel || !materi || !kelas) { alert("Mohon lengkapi Mapel, Kelas, dan Materi!"); return; }

            const btn = document.getElementById('btnGenerate');
            btn.innerHTML = "Sedang Memproses..."; btn.disabled = true;

            // Kumpulkan Level Kognitif
            const levels = Array.from(document.querySelectorAll('.kognitif-btn.active')).map(b => b.getAttribute('data-val')).join(", ");
            
            const prompt = `Buatkan naskah soal lengkap untuk ${mapel} kelas ${kelas}. Materi: ${materi}. 
            Gunakan level kognitif: ${levels}. 
            Distribusi: ${document.getElementById('numMudah').value} Mudah, ${document.getElementById('numSedang').value} Sedang, ${document.getElementById('numSulit').value} Sulit.
            Tampilkan dalam format naskah soal yang rapi dengan kunci jawaban di akhir.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const teks = data.candidates[0].content.parts[0].text;

                document.getElementById('containerHasil').classList.remove('hidden');
                document.getElementById('hasilSoal').innerText = teks;
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } catch (e) {
                alert("Gagal memanggil AI. Periksa API Key atau koneksi Anda.");
            } finally {
                btn.innerHTML = `<i data-lucide="sparkles" class="w-6 h-6"></i> Buat Naskah Soal`;
                btn.disabled = false; lucide.createIcons();
            }
        }

        function copyHasil() {
            const text = document.getElementById('hasilSoal').innerText;
            navigator.clipboard.writeText(text); alert("Naskah soal disalin ke clipboard!");
        }
    </script>
</body>
</html>
