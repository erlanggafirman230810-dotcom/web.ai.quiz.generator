<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Soal AI - Fix C1-C6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; text-align: left; }
        
        /* CSS KHUSUS TOMBOL KOGNITIF */
        .kognitif-btn { 
            @apply border border-gray-200 rounded-2xl p-4 text-center cursor-pointer transition-all duration-200 bg-white flex flex-col items-center justify-center gap-1 select-none shadow-sm; 
        }
        /* Ini warna kalau diklik (Aktif) */
        .kognitif-btn.active { 
            background-color: #4f46e5 !important; /* Warna Indigo-600 */
            color: white !important;
            border-color: #4f46e5 !important;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .kognitif-btn span { @apply text-[10px] font-bold opacity-60 uppercase tracking-widest; }
        .kognitif-btn.active span { color: white !important; opacity: 1 !important; }
        .kognitif-btn strong { @apply text-sm font-bold; }
        
        .input-number { @apply border border-gray-300 rounded-lg p-1.5 w-16 text-center text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500 transition-all; }
        #hasilSoal { white-space: pre-wrap; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="apiModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-8 text-left">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-100 p-2.5 rounded-xl text-indigo-600"><i data-lucide="settings-2"></i></div>
                    <h3 class="text-xl font-extrabold text-slate-800">Pengaturan API</h3>
                </div>
                <button onclick="toggleModal()" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-6 text-left">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2 block text-left">Gemini API Key</label>
                    <input type="password" id="gemini_key" placeholder="Masukkan API Key..." class="w-full px-4 py-3 bg-slate-50 rounded-xl outline-none border-none text-sm">
                </div>
                <button onclick="saveApiKeys()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-xl transition-all">Simpan Konfigurasi</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-6 md:p-10 rounded-[3rem] shadow-2xl border border-slate-100">
        <div class="flex justify-between items-center mb-12 border-b border-slate-50 pb-8 text-left">
            <div class="flex items-center gap-5">
                <div class="bg-indigo-600 p-4 rounded-2xl text-white shadow-xl"><i data-lucide="zap"></i></div>
                <div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tighter">AI Question Generator</h1>
                    <p class="text-slate-500 font-medium text-sm">Buat soal standar kognitif C1-C6 secara otomatis</p>
                </div>
            </div>
            <button onclick="toggleModal()" class="p-3.5 bg-slate-50 text-slate-600 rounded-2xl hover:bg-indigo-50 hover:text-indigo-600 transition-all border border-slate-100">
                <i data-lucide="settings"></i>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 text-left">
            <div class="space-y-10 text-left">
                <section>
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Identitas Soal</h2>
                    <input type="text" id="mapel" placeholder="Mata Pelajaran..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none mb-4 font-bold text-sm">
                    
                    <select id="kelas" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm mb-4">
                        <option value="" disabled selected>Pilih Kelas</option>
                        <optgroup label="SD / MI">
                            <option>Kelas 1 SD/MI</option><option>Kelas 2 SD/MI</option><option>Kelas 3 SD/MI</option>
                            <option>Kelas 4 SD/MI</option><option>Kelas 5 SD/MI</option><option>Kelas 6 SD/MI</option>
                        </optgroup>
                        <optgroup label="SMP / SMA">
                            <option>Kelas 7 SMP</option><option>Kelas 8 SMP</option><option>Kelas 9 SMP</option>
                            <option>Kelas 10 SMA</option><option>Kelas 11 SMA</option><option>Kelas 12 SMA</option>
                        </optgroup>
                    </select>

                    <div class="grid grid-cols-2 gap-4">
                        <select id="jenisSoal" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                            <option>Pilihan Ganda</option><option>Isian</option><option>Essay</option>
                        </select>
                        <select id="jumlahOpsi" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                            <option value="3">3 Opsi (A,B,C)</option>
                            <option value="4" selected>4 Opsi (A,B,C,D)</option>
                            <option value="5">5 Opsi (A,B,C,D,E)</option>
                        </select>
                    </div>
                </section>

                <section>
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Kesulitan</h2>
                    <div class="bg-slate-50 p-6 rounded-[2rem] space-y-4">
                        <div class="flex justify-between items-center"><label class="text-sm font-bold flex gap-2"><input type="checkbox" id="checkMudah"> Mudah</label><input type="number" id="numMudah" value="0" class="input-number"></div>
                        <div class="flex justify-between items-center"><label class="text-sm font-bold flex gap-2"><input type="checkbox" checked> Sedang</label><input type="number" id="numSedang" value="5" class="input-number"></div>
                        <div class="flex justify-between items-center"><label class="text-sm font-bold flex gap-2"><input type="checkbox" checked> Sulit</label><input type="number" id="numSulit" value="5" class="input-number"></div>
                    </div>
                </section>
            </div>

            <div class="space-y-10 text-left">
                <section>
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Cakupan Materi</h2>
                    <textarea id="materiInput" class="w-full h-32 p-5 bg-slate-50 rounded-[2rem] outline-none text-sm font-medium resize-none" placeholder="Tulis atau tempel materi soal di sini..."></textarea>
                </section>

                <section>
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 font-bold">Level Kognitif (Pilih Salah Satu / Lebih)</h2>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div class="kognitif-btn active" onclick="pilihLevel(this)" data-level="C1"><span>C1</span><strong>Mengingat</strong></div>
                        <div class="kognitif-btn active" onclick="pilihLevel(this)" data-level="C2"><span>C2</span><strong>Memahami</strong></div>
                        <div class="kognitif-btn" onclick="pilihLevel(this)" data-level="C3"><span>C3</span><strong>Menerapkan</strong></div>
                        <div class="kognitif-btn" onclick="pilihLevel(this)" data-level="C4"><span>C4</span><strong>Menganalisis</strong></div>
                        <div class="kognitif-btn" onclick="pilihLevel(this)" data-level="C5"><span>C5</span><strong>Mengevaluasi</strong></div>
                        <div class="kognitif-btn" onclick="pilihLevel(this)" data-level="C6"><span>C6</span><strong>Mencipta</strong></div>
                    </div>

                    <div class="space-y-3">
                        <div class="p-4 bg-white border border-slate-100 rounded-2xl flex items-center justify-between"><label class="flex items-center gap-3 text-sm font-bold"><input type="checkbox" id="checkGambar"> Pakai Gambar AI</label><input type="number" id="numGambar" value="0" class="input-number"></div>
                        <div class="p-4 bg-white border border-slate-100 rounded-2xl flex items-center justify-between"><label class="flex items-center gap-3 text-sm font-bold"><input type="checkbox" id="checkWacana"> Sertakan Wacana</label><input type="number" id="numWacana" value="0" class="input-number"></div>
                    </div>
                </section>

                <button id="btnGen" onclick="jalankanProses()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-[2rem] shadow-2xl hover:bg-indigo-700 transition-all text-lg flex justify-center gap-3 active:scale-95">
                    <i data-lucide="sparkles"></i> Buat Naskah Soal
                </button>
            </div>
        </div>

        <div id="containerHasil" class="hidden mt-12 p-8 bg-slate-900 rounded-[2rem] text-slate-100 text-left">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-xl flex gap-2"><i data-lucide="file-text"></i> Naskah Soal Berhasil Dibuat</h3>
                <button onclick="copyTeks()" class="bg-indigo-500 hover:bg-indigo-400 px-4 py-2 rounded-xl text-xs font-bold transition-all">Salin Semua</button>
            </div>
            <div id="hasilSoal" class="text-sm bg-slate-800 p-6 rounded-xl border border-slate-700 leading-relaxed overflow-x-auto text-left"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // FUNGSI KLIK LEVEL (INI YANG DI REVISI TOTAL)
        function pilihLevel(element) {
            element.classList.toggle('active');
            console.log("Level " + element.getAttribute('data-level') + " diklik"); // Cek di console log browser
        }

        function toggleModal() {
            document.getElementById('apiModal').classList.toggle('hidden');
            document.getElementById('gemini_key').value = localStorage.getItem('GKEY') || '';
        }

        function saveApiKeys() {
            localStorage.setItem('GKEY', document.getElementById('gemini_key').value);
            alert('API Key tersimpan!'); toggleModal();
        }

        async function jalankanProses() {
            const apiKey = localStorage.getItem('GKEY');
            if (!apiKey) { alert("Isi API Key di tombol Gerigi!"); toggleModal(); return; }

            const mapel = document.getElementById('mapel').value;
            const kelas = document.getElementById('kelas').value;
            const materi = document.getElementById('materiInput').value;
            const jenis = document.getElementById('jenisSoal').value;
            const opsi = document.getElementById('jumlahOpsi').value;

            // Kumpulkan level yang berwarna UNGU (class 'active')
            const selectedLevels = Array.from(document.querySelectorAll('.kognitif-btn.active'))
                                        .map(el => el.getAttribute('data-level')).join(", ");

            if (!mapel || !kelas || !materi || !selectedLevels) { 
                alert("Mohon lengkapi Mapel, Kelas, Materi, dan PILIH LEVEL C1-C6 (Klik sampai ungu)!"); 
                return; 
            }

            const btn = document.getElementById('btnGen');
            btn.innerHTML = "Sedang Membuat Soal..."; btn.disabled = true;

            const prompt = `Buatkan soal ${jenis} untuk ${mapel} kelas ${kelas}. Materi: ${materi}. Level Kognitif: ${selectedLevels}. Gunakan ${opsi} opsi pilihan (A,B,C...). Jumlah: Mudah(${document.getElementById('numMudah').value}), Sedang(${document.getElementById('numSedang').value}), Sulit(${document.getElementById('numSulit').value}). Tambahkan instruksi gambar untuk ${document.getElementById('numGambar').value} soal dan wacana teks untuk ${document.getElementById('numWacana').value} soal. Berikan kunci jawaban.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                document.getElementById('containerHasil').classList.remove('hidden');
                document.getElementById('hasilSoal').innerText = data.candidates[0].content.parts[0].text;
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } catch (e) {
                alert("Gagal memanggil AI. Periksa API Key.");
            } finally {
                btn.innerHTML = `<i data-lucide="sparkles"></i> Buat Naskah Soal`;
                btn.disabled = false; lucide.createIcons();
            }
        }

        function copyTeks() {
            navigator.clipboard.writeText(document.getElementById('hasilSoal').innerText);
            alert("Naskah soal disalin ke clipboard!");
        }
    </script>
</body>
</html>
