<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator PRO</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color:#fff;
  transition:0.3s;
}
.light {
  background:#f5f5f5;
  color:#000;
}
.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}
select,input,button {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}
button {
  background:#00c6ff;
  color:white;
  cursor:pointer;
}
.soal {
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
}
img {
  width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>AI Quiz Generator 🔥</h2>

<input type="password" id="apiKey" placeholder="API Key">

<select id="kurikulum">
<option>Kurikulum Merdeka</option>
<option>Kurikulum 2013</option>
<option>Kurikulum Berbasis Cinta</option>
<option>Cambridge</option>
</select>

<select id="jenjang">
<option value="">Jenjang</option>
<option>SD</option>
<option>SMP</option>
<option>SMA</option>
</select>

<select id="mapel"></select>
<select id="kelas"></select>
<select id="materi"></select>

<select id="bentuk">
<option>Pilihan Ganda</option>
<option>Essay</option>
<option>Benar/Salah</option>
</select>

<input type="number" id="jumlah" placeholder="Jumlah soal max 20">

<input type="number" id="opsi" placeholder="Jumlah opsi (PG)">

<select id="bloom">
<option>C1</option><option>C2</option><option>C3</option>
<option>C4</option><option>C5</option><option>C6</option>
</select>

<select id="level">
<option>Mudah</option>
<option>Sedang</option>
<option>Sulit</option>
</select>

<label><input type="checkbox" id="gambar"> Soal Bergambar</label>
<button onclick="toggleMode()">Dark / Light</button>
<button onclick="generate()">Generate Soal</button>

<div id="output"></div>
</div>

<script>

// ===== DARK MODE
function toggleMode(){
 document.body.classList.toggle("light");
}

// ===== DATABASE SUPER
const data = {
SMA:{
 "Matematika":{
  "12":["Integral","Statistika","Peluang"]
 }
},
SMP:{
 "Matematika":{
  "9":["Persamaan","Statistika"]
 }
}
};

// ===== DROPDOWN
jenjang.onchange=()=>{
 mapel.innerHTML="";kelas.innerHTML="";materi.innerHTML="";
 Object.keys(data[jenjang.value]||{}).forEach(m=>{
  let o=new Option(m,m);mapel.add(o);
 });
};
mapel.onchange=()=>{
 kelas.innerHTML="";materi.innerHTML="";
 Object.keys(data[jenjang.value][mapel.value]).forEach(k=>{
  let o=new Option(k,k);kelas.add(o);
 });
};
kelas.onchange=()=>{
 materi.innerHTML="";
 data[jenjang.value][mapel.value][kelas.value].forEach(m=>{
  let o=new Option(m,m);materi.add(o);
 });
};

// ===== PARSE
function extractJSON(text){
 try{return JSON.parse(text);}
 catch{
  let match=text.match(/\[\s*{[\s\S]*}\s*\]/);
  if(match) return JSON.parse(match[0]);
 }
 return null;
}

// ===== GENERATE
async function generate(){
 let apiKey=apiKeyInput.value;
 let jml=parseInt(jumlah.value);

 if(jml>20){alert("Max 20 soal");return;}

 output.innerHTML="Loading...";

 let res=await fetch("https://api.openai.com/v1/chat/completions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer "+apiKey,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"gpt-4o-mini",
   messages:[{
    role:"user",
    content:`
Buat soal sesuai kurikulum.

Kurikulum: ${kurikulum.value}
Jenjang: ${jenjang.value}
Kelas: ${kelas.value}
Mapel: ${mapel.value}
Materi: ${materi.value}
Bentuk: ${bentuk.value}
Jumlah: ${jml}
Opsi: ${opsi.value}
Bloom: ${bloom.value}
Level: ${level.value}

FORMAT JSON:
[
{"soal":"","opsi":["A","B","C","D"],"jawaban":"","deskripsi_gambar":""}
]
`
   }]
  })
 });

 let dataAI=await res.json();
 let soal=extractJSON(dataAI.choices[0].message.content);

 if(!soal){output.innerHTML="Error AI";return;}

 output.innerHTML="";

 for(let i=0;i<soal.length;i++){
  let s=soal[i];
  let html=`<div class="soal"><b>${i+1}. ${s.soal}</b>`;

  if(s.opsi){
    s.opsi.forEach(o=>html+=`<div>- ${o}</div>`);
  }

  html+=`<br><i>Jawaban: ${s.jawaban}</i>`;

  if(gambar.checked){
    let imgRes=await fetch("https://api.openai.com/v1/images/generations",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+apiKey,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"gpt-image-1",
        prompt:s.deskripsi_gambar,
        size:"512x512"
      })
    });

    let imgData=await imgRes.json();
    html+=`<img src="${imgData.data[0].url}">`;
  }

  html+=`</div>`;
  output.innerHTML+=html;
 }
}

const apiKeyInput=document.getElementById("apiKey");

</script>

</body>
</html>
